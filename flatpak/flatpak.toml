# Default configuration shipped INSIDE the Alacritty Flatpak.
#
# Installed to /app/share/alacritty/flatpak.toml and passed via --config-file
# by the desktop entry. It must not reference any absolute home directory —
# this file ships to whatever machine installs the app.
#
# What it does: hands the login shell off to the host, so it runs on the real
# host instead of inside the Flatpak sandbox. Without this the terminal opens
# into the runtime's filesystem and is near-useless.
#
# It goes through /app/libexec/alacritty-host-shell rather than calling
# `flatpak-spawn --host` directly. Calling flatpak-spawn directly does put the
# shell on the host, but the *proxy* ends up owning the terminal, so the shell
# gets no controlling terminal and loses job control (no Ctrl+Z, no fg/bg).
# The relay opens a second PTY and deliberately leaves it unclaimed so the
# portal can give it to the shell. See the comments in that file.
#
# Your own settings still apply: the import below pulls in the standard
# per-user config if it exists. Alacritty merges imports with the importing
# file taking precedence, so fonts/colours/keybindings from your file are
# honoured while the shell override here stays in force. A missing import is
# logged and ignored, so it is fine not to have one.

[general]
import = ["~/.config/alacritty/alacritty.toml"]

[terminal.shell]
program = "/app/libexec/alacritty-host-shell"
# No args: the relay runs the host's own login shell ($SHELL), rather than
# assuming bash. It also restores TERM/COLORTERM, which the portal strips.

# Ctrl+scroll to zoom. Alacritty supports WheelUp/WheelDown as bindable mouse
# events but binds neither by default, so scroll-to-zoom does nothing out of
# the box — surprising for anyone arriving from GNOME Terminal or Ptyxis.
# The keyboard bindings (Ctrl+= / Ctrl+- / Ctrl+0 to reset) are built in.
[[mouse.bindings]]
mouse = "WheelUp"
mods = "Control"
action = "IncreaseFontSize"

[[mouse.bindings]]
mouse = "WheelDown"
mods = "Control"
action = "DecreaseFontSize"
