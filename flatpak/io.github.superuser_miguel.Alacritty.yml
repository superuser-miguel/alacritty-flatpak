id: io.github.superuser_miguel.Alacritty
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: alacritty

# Personal build only — never submitted to Flathub. Upstream has explicitly
# declined official Flatpak support and asked that no one publish an
# unofficial one either (see alacritty/alacritty#8770, #6474, #5828, #2571).
# This manifest exists purely for local, single-machine use.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Personal build: allow network during the build so cargo can fetch
    # crates.io deps. Flathub submissions vendor deps instead; not needed here.
    - --share=network

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Needed so `flatpak-spawn --host` (used by the shell override in
  # ~/.config/alacritty/flatpak.toml) can reach the host over the session bus.
  - --talk-name=org.freedesktop.Flatpak
  # A terminal is useless if it can't see your real filesystem.
  - --filesystem=home

modules:
  - name: alacritty
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/alacritty /app/bin/alacritty
      - install -Dm644 extra/logo/alacritty-term.svg
        /app/share/icons/hicolor/scalable/apps/io.github.superuser_miguel.Alacritty.svg
      - install -Dm644 io.github.superuser_miguel.Alacritty.desktop
        /app/share/applications/io.github.superuser_miguel.Alacritty.desktop
    sources:
      - type: git
        url: https://github.com/alacritty/alacritty.git
        tag: v0.17.0
      - type: file
        path: io.github.superuser_miguel.Alacritty.desktop
