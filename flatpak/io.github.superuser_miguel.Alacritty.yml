id: io.github.superuser_miguel.Alacritty
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: alacritty-launch

# Unofficial build. Upstream has explicitly declined official Flatpak support
# and is not involved in or responsible for this package (see
# alacritty/alacritty#8770, #6474, #5828, #2571). Not submitted to Flathub.
# Alacritty itself is Apache-2.0; this packaging is redistribution under that
# licence, not an endorsed release.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Personal build: allow network during the build so cargo can fetch
    # crates.io deps. Flathub submissions vendor deps instead; not needed here.
    - --share=network

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Needed so `flatpak-spawn --host` (used by /app/libexec/alacritty-host-shell)
  # can reach the host over the session bus. This is already full arbitrary
  # command execution on the host — it is what makes the terminal a terminal.
  - --talk-name=org.freedesktop.Flatpak
  # A terminal is useless if it can't see your real filesystem.
  - --filesystem=home
  # Shares the host's /dev instead of a private one. Without it the sandbox
  # gets its own devpts instance, so the PTY has no device node the host can
  # name: `ttyname()` fails and `tty`, `who` and utmp break. Grants nothing new
  # on top of --talk-name=org.freedesktop.Flatpak above, which is already
  # arbitrary host execution.
  - --device=all

modules:
  - name: alacritty
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/alacritty /app/bin/alacritty
      - install -Dm644 extra/logo/alacritty-term.svg
        /app/share/icons/hicolor/scalable/apps/io.github.superuser_miguel.Alacritty.svg
      - install -Dm644 io.github.superuser_miguel.Alacritty.desktop
        /app/share/applications/io.github.superuser_miguel.Alacritty.desktop
      - install -Dm644 io.github.superuser_miguel.Alacritty.metainfo.xml
        /app/share/metainfo/io.github.superuser_miguel.Alacritty.metainfo.xml
      # The shell override that makes the sandboxed terminal usable. Shipped
      # inside the app so it works on any machine, not just the build host.
      - install -Dm644 flatpak.toml /app/share/alacritty/flatpak.toml
      # PTY relay that gives the host shell a real controlling terminal.
      # python3 ships in the freedesktop Platform, so no host dependency.
      - install -Dm755 alacritty-host-shell /app/libexec/alacritty-host-shell
      # Host-visible `alacritty` shim. The shell runs outside the sandbox where
      # the real binary does not exist, so `alacritty msg ...` would fail; this
      # re-enters the Flatpak. Its own directory, so only this one name is
      # exposed on the host's PATH.
      - install -Dm755 alacritty-shim /app/libexec/host-path/alacritty
      # Per-instance IPC socket and log file. Every Flatpak instance is PID 2 in
      # its own namespace, and Alacritty names both after its PID, so instances
      # after the first collide. See the script for the measurements.
      - install -Dm755 alacritty-launch /app/bin/alacritty-launch
    sources:
      - type: git
        url: https://github.com/alacritty/alacritty.git
        tag: v0.17.0
        commit: 94e7c8874e526b1e67b349d9ba30ddf81669119e
      - type: file
        path: io.github.superuser_miguel.Alacritty.desktop
      - type: file
        path: io.github.superuser_miguel.Alacritty.metainfo.xml
      - type: file
        path: flatpak.toml
      - type: file
        path: alacritty-host-shell
      - type: file
        path: alacritty-shim
      - type: file
        path: alacritty-launch
